name: CodeXray CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (code-clone-xray)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: src/code-clone-xray
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: src/code-clone-xray
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust unit & integration tests
        working-directory: src/code-clone-xray
        run: cargo test

  dotnet:
    name: .NET 10 (CodeXrayMcp)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build CodeXray.slnx (Release)
        run: dotnet build CodeXray.slnx -c Release

  python-scripts:
    name: Python Governance & X-Ray Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff & pytest
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint scripts & wrappers
        run: python -m ruff check --isolated --select E4,E7,E9,F scripts wrappers
      - name: Run script tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
